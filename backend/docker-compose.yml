services:

  gateway-service:
    image: sih-gateway-service:3.0.0
    container_name: gateway-service
    build: ./java/gateway-service

    ports:
      - "5001:5001"

    restart: unless-stopped

    environment:
      EUREKA_SERVER_HOST: discovery-service
      EUREKA_SERVER_PORT: 5000
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      discovery-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      sql-service:
        condition: service_healthy
      sms-service:
        condition: service_healthy
      room-service:
        condition: service_healthy
      risk-engine-service:
        condition: service_healthy
      stomp-service:
        condition: service_healthy

    networks:
      - sih-network


  discovery-service:
    image: sih-discovery-service:1.0.0
    container_name: discovery-service
    build: ./java/discovery-service

    ports:
      - "5000:5000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    networks:
      - sih-network

  media-service:
    image: sih-media-service:3.0.0
    container_name: media-service
    build: ./java/media-service

    ports:
      - "5002:5002"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5002/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    environment:
      EUREKA_SERVER_HOST: discovery-service
      EUREKA_SERVER_PORT: 5000
      SPRING_PROFILES_ACTIVE: docker
      UPLOAD_DIR: /app/uploads

    volumes:
      - media_uploads:/app/uploads

    depends_on:
      discovery-service:
        condition: service_healthy

    networks:
      - sih-network

  room-service:
    image: sih-room-service:2.0.0
    container_name: room-service
    build: ./java/room-service

    ports:
      - "5004:5004"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5004/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    environment:
      EUREKA_SERVER_HOST: discovery-service
      EUREKA_SERVER_PORT: 5000
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      discovery-service:
        condition: service_healthy

    networks:
      - sih-network


  sql-service:
    image: sih-sql-service:2.7.0
    container_name: sql-service
    build: ./java/sql-service

    ports:
      - "5003:5003"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5003/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    environment:
      EUREKA_SERVER_HOST: discovery-service
      EUREKA_SERVER_PORT: 5000
      SPRING_PROFILES_ACTIVE: docker

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rakshak}
      DB_USERNAME: ${DB_USERNAME:-dev}
      DB_PASSWORD: ${DB_PASSWORD:-dev}

    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

    networks:
      - sih-network

  sms-service:
    image: sms-service:2.0.0
    container_name: sms-service
    build: ./java/sms-service

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5005/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    environment:
      EUREKA_SERVER_HOST: discovery-service
      EUREKA_SERVER_PORT: 5000
      SPRING_PROFILES_ACTIVE: docker
      SMS_DEVICE_IP: ${SMS_DEVICE_IP}
      SMS_DEVICE_PORT: ${SMS_DEVICE_PORT}
      SMS_DEVICE_USERNAME: ${SMS_DEVICE_USERNAME}
      SMS_DEVICE_PASSWORD: ${SMS_DEVICE_PASSWORD}

    depends_on:
      discovery-service:
        condition: service_healthy
      sql-service:
        condition: service_healthy

    networks:
      - sih-network

  postgres:
    image: postgres:15.18
    container_name: postgres
    restart: unless-stopped

    ports:
      - "9000:5432"

    environment:
      POSTGRES_USER: ${DB_USERNAME:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
      POSTGRES_DB: ${DB_NAME:-rakshak}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dev} -d ${DB_NAME:-rakshak}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - sih-network

  risk-engine-service:
    image: risk-engine-service:1.0.21
    container_name: risk-engine-service
    build: ./python/risk-engine-service

    ports:
      - "5007:5007"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5007/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    environment:
      EUREKA_HOST: discovery-service
      EUREKA_PORT: 5000

    depends_on:
      discovery-service:
        condition: service_healthy
      sms-service:
        condition: service_healthy

    networks:
      - sih-network

  stomp-service:
    image: stomp-service:1.0.10
    container_name: stomp-service
    build: ./python/stomp-service

    ports:
      - "5008:5008"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5008/health')" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    environment:
      EUREKA_HOST: discovery-service
      EUREKA_PORT: 5000

    depends_on:
      discovery-service:
        condition: service_healthy
      room-service:
        condition: service_healthy

    networks:
      - sih-network

  socket-service:
    image: socket-service
    container_name: socket-service
    build: ./python/socket-service

    ports:
      - "8000:8000"

    restart: unless-stopped


    networks:
      - sih-network

networks:
  sih-network:
    driver: bridge

volumes:
  postgres_data:
  media_uploads:

