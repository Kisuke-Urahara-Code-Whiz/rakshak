spring:
  application:
    name: gateway-service
  profiles:
    active: dev

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: '*'
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: '*'
            allowCredentials: false
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: media-service
              uri: lb://MEDIA-SERVICE
              predicates:
                - Path=/media/**
              filters:
                - StripPrefix=1

            - id: sms-test-service
              uri: lb://SMS-TEST-SERVICE
              predicates:
                - Path=/sms-test/**
              filters:
                - StripPrefix=1

            - id: sql-service
              uri: lb://SQL-SERVICE
              predicates:
                - Path=/sql/**
              filters:
                - StripPrefix=1

            - id: sms-service
              uri: lb://SMS-SERVICE
              predicates:
                - Path=/sms/**
              filters:
                - StripPrefix=1

            - id: room-service
              uri: lb://ROOM-SERVICE
              predicates:
                - Path=/room/**
              filters:
                - StripPrefix=1

            - id: risk-engine-service
              uri: lb://RISK-ENGINE-SERVICE
              predicates:
                - Path=/risk/**
              filters:
                - StripPrefix=1

            - id: stomp-service
              uri: lb://STOMP-SERVICE
              predicates:
                - Path=/stomp/**
              filters:
                - StripPrefix=1

            - id: static-loader-service
              uri: lb://STATIC-LOADER-SERVICE
              predicates:
                - Path=/static/**
              filters:
                - StripPrefix=1

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    lease-expiration-duration-in-seconds: 30
    lease-renewal-interval-in-seconds: 10