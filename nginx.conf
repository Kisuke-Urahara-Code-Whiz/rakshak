# ============================================================
# NGINX REVERSE PROXY CONFIGURATION
# Ports: 5001 (Gateway & /risk rewrite), 5002 (Ngrok), 5003 (Pinggy)
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream local backend gateway app
    upstream gateway_backend {
        server 127.0.0.1:5001;
    }

    # Upstream local Pinggy receiver port
    upstream pinggy_receiver {
        server 127.0.0.1:5003;
    }

    # ============================================================
    # 1. PRIMARY LOCAL GATEWAY & PATH TRANSLATOR (Port 5001)
    # ============================================================
    server {
        listen 5001;
        server_name localhost;

        # Direct local gateway traffic (App logic, API routes)
        location / {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Translates: /risk/ws/esp/device_1 -> /ws/esp/device_1 (Port 5003 / Pinggy)
        location /risk/ {
            # Trailing slash strips '/risk/' from the incoming path before sending to 5003
            proxy_pass http://pinggy_receiver/;

            # Host and IP header propagation
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Full-duplex bidirectional WebSocket headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Keep persistent IoT WebSocket connections alive (Prevents 60s drops)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # ============================================================
    # 2. NGROK ENTRYPOINT (Port 5002)
    # Receives SMS, Static Domain requests & STOMP server traffic
    # ============================================================
    server {
        listen 5002;
        server_name localhost;

        location / {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket/STOMP Upgrade Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # ============================================================
    # 3. PINGGY / ESP SPAWNER ENTRYPOINT (Port 5003)
    # Dedicated IoT WebSocket receiver channel for ESP32-S3
    # ============================================================
    server {
        listen 5003;
        server_name localhost;

        location / {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Full-duplex WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}